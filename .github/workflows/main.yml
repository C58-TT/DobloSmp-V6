name: DobloSmp V6 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/doblo_build.zip'
      - 'doblo_build.zip'
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source

          if [ -f ".github/workflows/doblo_build.zip" ]; then
            ZIP=".github/workflows/doblo_build.zip"
          elif [ -f "doblo_build.zip" ]; then
            ZIP="doblo_build.zip"
          else
            ZIP=$(find . -maxdepth 4 -name "*.zip" -print -quit || true)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "HATA: ZIP dosyasi bulunamadi!"
            ls -la .github/workflows/ || true
            exit 1
          fi

          echo "ZIP bulundu: $ZIP"
          unzip -q "$ZIP" -d source

          echo "Bulunan pom.xml dosyalari:"
          find source -name pom.xml -print

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          POM=$(find source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "HATA: pom.xml bulunamadi!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "Proje dizini: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          mvn -B clean package

          if ! find target -maxdepth 2 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "original-*.jar" | grep -q .; then
            echo "Uyari: package asamasinda JAR cikmadi, jar:jar deneniyor..."
            mvn -B jar:jar
          fi

      - name: Prepare JAR
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          find "$GITHUB_WORKSPACE/source" -type f -path '*/target/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' \
            -exec cp -v {} artifacts/ \;

          if [ -z "$(ls -A artifacts)" ]; then
            echo "HATA: JAR uretilmedi! target klasor icerigi:"
            find "$GITHUB_WORKSPACE/source" -path '*/target*' -ls || true
            exit 1
          fi

          ls -lah artifacts/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DobloSmp-V6-JAR
          path: artifacts/*.jar
          if-no-files-found: error
          
