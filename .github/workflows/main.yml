
name: DobloSmp V6 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Extract source
        run: |
          mkdir -p source
          
          ZIP=$(find . -type f -iname "*.zip" -print -quit)

         


          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyasi GitHub deposunda bulunamadi!"
            echo "Depodaki ZIP dosyalari:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "Bulunan dosya: $ZIP"
          unzip -q "$ZIP" -d source

          echo "Bulunan Maven projeleri:"
          find source -name pom.xml -print
          

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          POM=$(find source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "HATA: pom.xml bulunamadi!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "Proje dizini: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          mvn -B clean package

      - name: Prepare JAR
        run: |
          mkdir -p artifacts

          find source -type f -path '*/target/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} artifacts/ \;

          if [ -z "$(ls -A artifacts)" ]; then
            echo "HATA: JAR uretilmedi!"
            exit 1
          fi

          ls -lah artifacts/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DobloSmp-V6-JAR
          path: artifacts/*.jar
          if-no-files-found: error
          
